<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gestionale — Barber Shop Ernest</title>
<link rel="icon" href="../images/barber-ernest/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    color-scheme: dark;
    --ink: #090a0b;
    --raised: #111315;
    --raised-2: #171a1c;
    --paper: #f1f2f0;
    --muted: #a7abad;
    --steel: #c9cdd0;
    --line: rgba(201, 205, 208, .22);
    --line-strong: rgba(201, 205, 208, .45);
    --bad: #e2564a;
    --good: #6ab07a;
    --display: "Saira Condensed", "Arial Narrow", sans-serif;
    --body: "Saira", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  html { background: var(--ink); overscroll-behavior-y: none; }
  body { margin: 0; background: var(--ink); color: var(--paper); font: 400 15px/1.5 var(--body); overscroll-behavior-y: none; }
  /* deve battere i display: grid/flex dichiarati sotto, altrimenti l'attributo hidden non nasconde nulla */
  [hidden] { display: none !important; }
  h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: -.01em; text-transform: uppercase; margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

  .wrap { width: min(calc(100% - 24px), 1400px); margin-inline: auto; }

  /* ------------------------------------------------------------- testa */
  header.bar {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--line);
    background: rgba(9, 10, 11, .94);
    backdrop-filter: blur(12px);
  }
  .bar-row { display: flex; align-items: center; gap: 14px; min-height: 60px; flex-wrap: wrap; }
  .bar-row h1 { font-size: 1.2rem; letter-spacing: .06em; margin-right: auto; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; overscroll-behavior-x: contain; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 0 0 auto; padding: 12px 16px; border: 0; border-bottom: 2px solid transparent;
    background: none; color: var(--muted); cursor: pointer;
    font: 800 .74rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase;
  }
  .tab[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--paper); }

  /* ------------------------------------------------------------ comandi */
  button, select, input, textarea { font-family: inherit; border-radius: 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 40px; padding: 0 16px; border: 1px solid var(--line-strong);
    background: transparent; color: var(--paper); cursor: pointer;
    font: 800 .72rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase;
  }
  .btn:hover { border-color: var(--paper); }
  .btn-solid { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .btn-solid:hover { background: transparent; color: var(--paper); }
  .btn-bad { border-color: rgba(226, 86, 74, .6); color: #f0a49c; }
  .btn-bad:hover { border-color: var(--bad); }
  .btn-sm { min-height: 32px; padding: 0 10px; font-size: .66rem; }

  input[type=text], input[type=tel], input[type=date], input[type=time],
  input[type=number], input[type=password], select, textarea {
    width: 100%; min-height: 40px; padding: 9px 11px;
    border: 1px solid var(--line-strong); background: var(--raised); color: var(--paper);
    font: 400 .95rem/1.4 var(--body);
  }
  textarea { min-height: 76px; resize: vertical; }
  label.f { display: block; margin-bottom: 12px; }
  label.f > span {
    display: block; margin-bottom: 5px;
    font: 800 .66rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--steel);
  }
  .grid2 { display: grid; gap: 0 14px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  /* --------------------------------------------------------- calendario */
  .cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 0; }
  .cal-title { font: 800 1.5rem/1 var(--display); text-transform: uppercase; margin-right: auto; }

  .cal { display: grid; grid-template-columns: 56px 1fr; border: 1px solid var(--line); background: var(--raised); }
  .gutter { border-right: 1px solid var(--line); position: relative; }
  .gutter i {
    position: absolute; left: 0; right: 6px; text-align: right; transform: translateY(-50%);
    font: 600 .68rem/1 var(--body); color: var(--muted); font-style: normal;
  }
  .cols { display: grid; }
  .col { position: relative; border-left: 1px solid var(--line); min-width: 0; }
  .col:first-child { border-left: 0; }
  /* altezza fissa: la colonna oraria di sinistra si allinea a questa misura */
  .col-head {
    position: sticky; top: 60px; z-index: 5;
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px;
    border-bottom: 1px solid var(--line); background: var(--raised-2);
    font: 800 .74rem/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
    overflow: hidden; white-space: nowrap;
  }
  .dot { width: 10px; height: 10px; flex: 0 0 auto; }
  .track { position: relative; cursor: crosshair; }
  .hour { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(201,205,208,.10); }
  .hour.half { border-top-style: dotted; }
  .off {
    position: absolute; left: 0; right: 0; background: repeating-linear-gradient(
      -45deg, rgba(201,205,208,.05) 0 6px, transparent 6px 12px);
    border-block: 1px solid rgba(201,205,208,.12);
  }
  .off b { position: absolute; inset: 4px auto auto 6px; font: 800 .6rem/1 var(--display); letter-spacing: .1em; color: var(--muted); }

  /* left e width arrivano inline dal calcolo delle corsie (vista giorno) */
  .ev {
    position: absolute; left: 3px; right: 3px; min-width: 0; overflow: hidden;
    padding: 5px 7px; border: 1px solid; background: var(--raised-2); cursor: pointer;
    font-size: .74rem; line-height: 1.25; text-align: left;
  }
  .ev b { display: block; font: 800 .78rem/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .ev small { color: var(--muted); }
  .ev[data-stato="cancellata"] { opacity: .4; text-decoration: line-through; }
  .ev[data-stato="completata"] { border-style: dashed; }
  .ev[data-stato="no_show"] { border-color: var(--bad) !important; }

  /* ---------------------------------------------------------- settimana */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .wday { background: var(--raised); min-height: 150px; padding: 8px; }
  .wday h4 { margin: 0 0 8px; font: 800 .72rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--steel); }
  /* i button sono inline-block di default: senza display block si affiancherebbero */
  .wday .ev { position: static; display: block; margin-bottom: 4px; left: auto; right: auto; width: 100%; height: auto; }
  @media (max-width: 900px) { .week { grid-template-columns: 1fr; } }

  /* -------------------------------------------------------------- liste */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-size: .88rem; }
  th { font: 800 .66rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--steel); }
  .num { font-family: var(--display); font-weight: 800; font-size: 1rem; }
  .pill {
    display: inline-block; padding: 2px 7px; border: 1px solid var(--line-strong);
    font: 800 .6rem/1.5 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }
  .pill[data-s="confermata"] { border-color: var(--line-strong); color: var(--paper); }
  .pill[data-s="completata"] { border-color: rgba(106,176,122,.6); color: var(--good); }
  .pill[data-s="cancellata"] { opacity: .5; }
  .pill[data-s="no_show"] { border-color: rgba(226,86,74,.6); color: #f0a49c; }

  .card { border: 1px solid var(--line); background: var(--raised); padding: 16px; margin-bottom: 12px; }
  .card h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .row-between { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
  .stack { display: flex; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .totale { font: 800 1.6rem/1 var(--display); }

  section[hidden] { display: none; }
  main { padding-bottom: 80px; }

  /* -------------------------------------------------------------- modale */
  .modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-start; justify-content: center; background: rgba(9,10,11,.82); overflow-y: auto; padding: 24px 12px 60px; }
  .modal[data-open="true"] { display: flex; }
  .modal-box { width: min(100%, 520px); border: 1px solid var(--line-strong); background: var(--ink); padding: 22px; }
  .modal-box h2 { font-size: 1.4rem; margin-bottom: 14px; }

  /* --------------------------------------------------------------- login */
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .login form { width: min(100%, 340px); }
  .login h1 { font-size: 2rem; margin-bottom: 6px; }
  .login p { color: var(--muted); margin: 0 0 22px; font-size: .9rem; }
</style>
</head>
<body>

<div class="login" id="login">
  <form id="login-form">
    <h1>Gestionale</h1>
    <p>Barber Shop Ernest — area riservata.</p>
    <label class="f"><span>Password</span><input type="password" name="pw" autocomplete="current-password" required></label>
    <button class="btn btn-solid" type="submit" style="width:100%">Entra</button>
    <p id="login-err" style="color:#f0a49c;margin-top:14px" hidden>Password errata.</p>
  </form>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="wrap bar-row">
      <h1>Ernest — Gestionale</h1>
      <span class="muted" id="oggi-info"></span>
      <a class="btn btn-sm" href="../index.html">Vedi il sito</a>
      <button class="btn btn-sm" id="btn-esci" type="button">Esci</button>
    </div>
    <div class="wrap">
      <p id="stato-collegamento" hidden
         style="margin:0 0 10px;padding:8px 12px;background:#4a2b26;color:#f0a49c;border-radius:4px"></p>
    </div>
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="calendario" aria-selected="true">Calendario</button>
        <button class="tab" role="tab" data-tab="lista" aria-selected="false">Lista del giorno</button>
        <button class="tab" role="tab" data-tab="attesa" aria-selected="false">Lista d'attesa</button>
        <button class="tab" role="tab" data-tab="barbieri" aria-selected="false">Barbieri</button>
        <button class="tab" role="tab" data-tab="servizi" aria-selected="false">Servizi</button>
        <button class="tab" role="tab" data-tab="chiusure" aria-selected="false">Chiusure</button>
        <button class="tab" role="tab" data-tab="impostazioni" aria-selected="false">Impostazioni</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="gest-main">
    <section id="tab-calendario"></section>
    <section id="tab-lista" hidden></section>
    <section id="tab-attesa" hidden></section>
    <section id="tab-barbieri" hidden></section>
    <section id="tab-servizi" hidden></section>
    <section id="tab-chiusure" hidden></section>
    <section id="tab-impostazioni" hidden></section>
  </main>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>

<script src="config.js"></script>
<script src="tempo.js"></script>
<script src="seed.js"></script>
<script src="engine.js"></script>
<script src="selfcheck.js"></script>
<script src="admin.js"></script>
<script src="admin-prenotazioni.js"></script>
<script src="admin-anagrafiche.js"></script>
<script>ErnestAdmin.avvia();</script>
</body>
</html>
